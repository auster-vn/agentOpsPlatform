agentops:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      user: "{{ env_var('POSTGRES_USER', 'agentops') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'agentops') }}"
      port: 5432
      dbname: "{{ env_var('POSTGRES_DB', 'agentops') }}"
      schema: public
      threads: 4
      keepalives_idle: 0
      connect_timeout: 10
