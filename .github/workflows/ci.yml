name: AgentOps Platform CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ML dependencies
        run: pip install -r ml/requirements.txt

      - name: Install API dependencies
        run: pip install -r api/requirements.txt

      - name: Lint with Ruff
        run: |
          pip install ruff
          ruff check ingestion/ spark/ airflow/dags/ ml/ api/ --ignore E501,F401

      - name: Run unit tests
        run: |
          pip install pytest pytest-cov
          pytest tests/ -v --tb=short || true

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: false
          tags: agentops/api:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build Dashboard image
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          push: false
          tags: agentops/dashboard:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Start core services
        run: |
          docker compose up -d postgres minio
          sleep 15

      - name: Run DB schema init
        run: |
          docker compose exec -T postgres psql -U agentops -f /docker-entrypoint-initdb.d/init_db.sql || true

      - name: Check API health
        run: |
          docker compose up -d api
          sleep 20
          curl --fail http://localhost:8000/health || exit 1

      - name: Teardown
        if: always()
        run: docker compose down -v
